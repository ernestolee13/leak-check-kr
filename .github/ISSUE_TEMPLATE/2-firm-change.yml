name: 법무법인 조건 변경, 마감, 삭제 요청
description: 조건이 바뀌었거나 마감됐거나 목록에서 빼야 할 때. 삭제는 명확한 근거가 있을 때만 합니다.
title: "[조건 변경] 사건명 / 법무법인"
labels: ["firm-change"]
body:
  - type: markdown
    attributes:
      value: |
        **변경**: 공식 페이지에서 바뀐 내용이 확인되면 반영합니다.
        **마감 표시나 삭제**: 마감 공지, 모집 페이지 삭제, 법무법인의 공식 정정처럼 **명확한 근거**가 있을 때만 합니다. 「별로였다」 같은 평가나 후기로는 빼지 않습니다.
  - type: input
    id: case
    attributes: {label: 사건}
    validations: {required: true}
  - type: input
    id: firm
    attributes: {label: 법무법인}
    validations: {required: true}
  - type: dropdown
    id: kind
    attributes:
      label: 요청 종류
      options: ["조건 변경", "마감", "목록에서 삭제", "링크 변경"]
    validations: {required: true}
  - type: input
    id: evidence
    attributes: {label: 근거 주소, description: "마감 공지나 바뀐 조건이 적힌 공식 페이지"}
    validations: {required: true}
  - type: textarea
    id: detail
    attributes: {label: 무엇이 바뀌었나, description: "페이지 문장을 그대로 옮겨 주세요"}
    validations: {required: true}
